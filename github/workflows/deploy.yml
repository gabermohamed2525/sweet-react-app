name: Build and Deploy Vite App

# بتحدد إمتى الـ Workflow ده يشتغل (مثلاً لما تعمل push على فرع main)
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع من الريبو
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # يقدر يشتغل على إصدار 18 أو 20
          cache: 'npm'

      # 3. تحميل الحزم (Dependencies)
      - name: Install dependencies
        run: npm ci

      # 4. بناء المشروع (Vite Build) والتأكد إن مفيش أخطاء
      - name: Build project
        run: npm run build